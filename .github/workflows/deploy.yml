name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build production bundle
        run: npm run build

      - name: Verify production build output
        run: |
          test -f dist/index.html || (echo "dist/index.html does not exist!" && exit 1)
          grep -q "assets/" dist/index.html || (echo "dist/index.html does not reference compiled assets!" && exit 1)
          ! grep -q "src/main.tsx" dist/index.html || (echo "dist/index.html still references main.tsx!" && exit 1)
          echo "Production build output verified successfully."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
