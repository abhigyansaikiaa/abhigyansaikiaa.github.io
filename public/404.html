<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Abhigyan Saikia</title>
    <meta name="robots" content="NOINDEX,FOLLOW" />
    <link rel="icon" href="/assets-unifex/images/logo/favicon.png" type="image/png" />
    <style>
      :root {
        --bg: #08080a;
        --card: #121217;
        --border: rgba(255, 255, 255, 0.1);
        --accent: #e11d2a;
        --text: #f1eee8;
        --muted: #94a3b8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .error-card {
        max-width: 520px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .error-badge {
        display: inline-block;
        font-family: monospace;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent);
        background: rgba(225, 29, 42, 0.1);
        border: 1px solid rgba(225, 29, 42, 0.25);
        padding: 0.3rem 0.75rem;
        border-radius: 9999px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 2.25rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-bottom: 0.75rem;
        color: #ffffff;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .actions-row {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.4rem;
        border-radius: 0.5rem;
        font-size: 0.88rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: var(--accent);
        color: #ffffff;
      }
      .btn-primary:hover {
        background: #c81521;
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--text);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <span class="error-badge">HTTP 404 • ROUTE NOT FOUND</span>
      <h1>Page Not Found</h1>
      <p>
        The requested address does not exist or has been relocated. You can return directly to the main portfolio or inspect selected production work.
      </p>
      <div class="actions-row">
        <a href="/" class="btn btn-primary">Return to Homepage</a>
        <a href="/#works" class="btn btn-secondary">Selected Work</a>
      </div>
    </div>
  </body>
</html>
